<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title>Dashboard — Comeback Gear LLC</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0d1117;color:#c9d1d9;line-height:1.5;padding:16px}
    .wrap{max-width:900px;margin:0 auto}
    h1{font-size:20px;font-weight:600;margin-bottom:4px;color:#f0f6fc}
    .sub{font-size:13px;color:#8b949e;margin-bottom:20px}
    .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px}
    .metric{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px}
    .metric .label{font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:.5px}
    .metric .val{font-size:22px;font-weight:600;margin-top:2px}
    .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
    .filters button{font-size:12px;padding:5px 12px;border-radius:20px;border:1px solid #30363d;background:#161b22;color:#8b949e;cursor:pointer;transition:all .15s}
    .filters button:hover{border-color:#58a6ff;color:#58a6ff}
    .filters button.active{background:#1f6feb;border-color:#1f6feb;color:#fff}
    .section{margin-bottom:14px;border:1px solid #30363d;border-radius:8px;background:#161b22;overflow:hidden}
    .sec-head{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;user-select:none}
    .sec-head:hover{background:#1c2128}
    .sec-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
    .sec-title{font-size:14px;font-weight:500;color:#f0f6fc;flex:1}
    .sec-count{font-size:12px;color:#8b949e;background:#21262d;padding:2px 8px;border-radius:10px}
    .sec-arrow{color:#8b949e;font-size:12px;transition:transform .2s}
    .sec-arrow.open{transform:rotate(90deg)}
    .sec-body{border-top:1px solid #30363d}
    .sec-body.collapsed{display:none}
    .item{display:flex;align-items:flex-start;gap:8px;padding:8px 14px;font-size:13px;border-bottom:1px solid #21262d;flex-wrap:wrap}
    .item:last-child{border-bottom:none}
    .item:hover{background:#1c2128}
    .item-row{display:flex;align-items:center;gap:8px;width:100%}
    .item-check{width:16px;height:16px;border-radius:4px;border:1.5px solid #30363d;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;margin-top:1px}
    .item-check.checked{background:#1f6feb;border-color:#1f6feb}
    .item-check.checked::after{content:"";display:block;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);margin-top:-2px}
    .item-text{flex:1;color:#c9d1d9}
    .item-text.checked-text{text-decoration:line-through;color:#484f58}
    .item-note{font-size:11px;color:#6e7681;max-width:200px;text-align:right}
    .badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500;white-space:nowrap}
    .b-todo{background:#21262d;color:#8b949e}
    .b-done{background:#0d4429;color:#3fb950}
    .b-ready{background:#0c2d6b;color:#58a6ff}
    .b-testing{background:#3d2e00;color:#d29922}
    .b-high{background:#4a0e0e;color:#f85149}
    .b-bug{background:#4a0e0e;color:#f85149}
    .b-inconclusive{background:#3d2e00;color:#d29922}
    .b-blocked{background:#4a0e0e;color:#f85149}
    .b-paused{background:#3d2e00;color:#d29922}
    .b-deferred{background:#21262d;color:#8b949e}
    .updated{font-size:11px;color:#484f58;text-align:center;margin-top:20px}
    .sync-status{font-size:10px;color:#484f58;text-align:center;margin-top:4px}
    .sync-status.syncing{color:#d29922}
    .sync-status.synced{color:#3fb950}
    .sync-status.error{color:#f85149}
    .note-btn{background:none;border:none;color:#484f58;cursor:pointer;font-size:14px;padding:0 2px;line-height:1;flex-shrink:0}
    .note-btn:hover{color:#58a6ff}
    .note-btn.has-note{color:#f0883e}
    .user-note{width:100%;margin-top:4px;padding:4px 0 0 24px}
    .user-note-text{font-size:12px;color:#f0883e;background:#1c1206;border:1px solid #3d2e00;border-radius:4px;padding:4px 8px;display:inline-block;max-width:100%}
    .user-note-edit{width:calc(100% - 24px);margin-left:24px;background:#0d1117;border:1px solid #f0883e;border-radius:4px;padding:5px 8px;color:#f0883e;font-size:12px;outline:none;margin-top:4px}
    .inbox-wrap{margin-bottom:20px;border:1px solid #f0883e;border-radius:8px;background:#161b22;overflow:hidden}
    .inbox-header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#1c1206;border-bottom:1px solid #f0883e}
    .inbox-header h2{font-size:14px;font-weight:500;color:#f0883e;flex:1}
    .inbox-count{font-size:12px;color:#f0883e;background:#3d2e00;padding:2px 8px;border-radius:10px}
    .inbox-add{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid #21262d}
    .inbox-add input{flex:1;background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:7px 10px;color:#c9d1d9;font-size:13px;outline:none}
    .inbox-add input:focus{border-color:#58a6ff}
    .inbox-add input::placeholder{color:#484f58}
    .inbox-add button{background:#1f6feb;border:none;border-radius:6px;padding:7px 14px;color:#fff;font-size:13px;cursor:pointer;font-weight:500}
    .inbox-add button:hover{background:#388bfd}
    .inbox-item{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:13px;border-bottom:1px solid #21262d}
    .inbox-item:last-child{border-bottom:none}
    .inbox-item:hover{background:#1c2128}
    .inbox-item .item-text{flex:1}
    .inbox-item .inbox-time{font-size:11px;color:#6e7681}
    .inbox-del{background:none;border:none;color:#484f58;cursor:pointer;font-size:16px;padding:0 4px;line-height:1}
    .inbox-del:hover{color:#f85149}
    .inbox-empty{padding:12px 14px;font-size:13px;color:#484f58;font-style:italic}
    @media(max-width:600px){
      body{padding:10px}
      .metrics{grid-template-columns:repeat(2,1fr)}
      .item-note{max-width:120px}
    }
  </style>
</head>

function setSyncStatus(text, cls) {
  var el = document.getElementById("sync-status");

function saveLocal() {
  localStorage.setItem("dash_checked", JSON.stringify(checked));
  localStorage.setItem("dash_inbox", JSON.stringify(inbox));
  localStorage.setItem("dash_notes", JSON.stringify(notes));
}

function syncToSupabase() {
  if (syncTimer) clearTimeout(syncTimer);
  setSyncStatus("saving...", "syncing");
  syncTimer = setTimeout(function() {
    fetch(SB_URL + "/rest/v1/dashboard_state?id=eq.default", {
      method: "PATCH",
      headers: {
        "Content-Type": "application/json",
        "apikey": SB_KEY,
        "Authorization": "Bearer " + SB_KEY,
        "Prefer": "return=minimal"
      },
      body: JSON.stringify({
        checked: checked,
        inbox: inbox,
        notes: notes,
        updated_at: new Date().toISOString()
      })
    }).then(function(r) {
      if (!r.ok) { setSyncStatus("sync failed", "error"); console.error("Sync failed:", r.status); }
      else { setSyncStatus("synced", "synced"); setTimeout(function(){ setSyncStatus(""); }, 3000); }
    }).catch(function(e) { setSyncStatus("offline — saved locally", "error"); console.error("Sync error:", e); });
  }, 2000);
}

function saveChecked() { saveLocal(); syncToSupabase(); }
function saveInbox() { saveLocal(); syncToSupabase(); }
function saveNotes() { saveLocal(); syncToSupabase(); }

function loadFromSupabase() {
  fetch(SB_URL + "/rest/v1/dashboard_state?id=eq.default&select=*", {
    headers: { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY }
  }).then(function(r) { return r.json(); })
    .then(function(rows) {
      if (rows.length > 0) {
        var row = rows[0];
        var hasRemote = (row.checked && Object.keys(row.checked).length > 0) ||
                        (row.inbox && row.inbox.length > 0) ||
                        (row.notes && Object.keys(row.notes).length > 0);
        if (hasRemote) {
          checked = row.checked || {};
          inbox = row.inbox || [];
          notes = row.notes || {};
          saveLocal();
          renderInbox(); render();
          setSyncStatus("loaded from cloud", "synced");
        } else {
          syncToSupabase();
        }
        setTimeout(function(){ setSyncStatus(""); }, 3000);
      }
    }).catch(function(e) { console.error("Load error:", e); setSyncStatus("offline — using local", "error"); });
}

function count(statuses){
  return Object.values(DATA).flatMap(function(s){return s.items}).filter(function(i){return statuses.indexOf(i.s)!==-1}).length;
}

function renderInbox(){
  var h = '<div class="inbox-wrap">';
  h += '<div class="inbox-header"><h2>Inbox</h2>';
  if(inbox.length) h += '<span class="inbox-count">'+inbox.length+'</span>';
  h += '</div>';
  h += '<div class="inbox-add"><input type="text" id="inbox-input" placeholder="Quick capture — type a task and hit enter" onkeydown="if(event.key===\'Enter\')addInbox()" />';
  h += '<button onclick="addInbox()">Add</button></div>';
  if(inbox.length === 0){
    h += '<div class="inbox-empty">Empty — add stuff here as you think of it, tell Claude to sync later.</div>';
  } else {
    inbox.forEach(function(item, i){
      h += '<div class="inbox-item">';
      h += '<div class="item-text">'+esc(item.text)+'</div>';
      h += '<span class="inbox-time">'+item.time+'</span>';
      h += '<button class="inbox-del" onclick="delInbox('+i+')" title="Remove">x</button>';
      h += '</div>';
    });
  }
  h += '</div>';
  document.getElementById("inbox").innerHTML = h;
}

function addInbox(){
  var inp = document.getElementById("inbox-input");
  var val = inp.value.trim();
  if(!val) return;
  var now = new Date();
  var timeStr = (now.getMonth()+1)+"/"+now.getDate()+" "+now.getHours()+":"+String(now.getMinutes()).padStart(2,"0");
  inbox.unshift({text: val, time: timeStr});
  saveInbox();
  renderInbox();
  renderMetrics();
  setTimeout(function(){document.getElementById("inbox-input").focus()},50);
}

function delInbox(i){
  inbox.splice(i, 1);
  saveInbox();
  renderInbox();
  renderMetrics();
}

function esc(s){
  var d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

  var all = Object.values(DATA).flatMap(function(s){return s.items});

    met("Bugs",count(["bug","inconclusive"]),"#f85149"),
    met("Notes",notesCount,"#f0883e")
  ].join("");
}

  var fh = '<button class="'+(filter==="all"?"active":"")+'" onclick="setF(\'all\')">All</button>';
  keys.forEach(function(k){
    fh+='<button class="'+(filter===k?"active":"")+'" onclick="setF(\''+k.replace(/'/g,"\\'")+"')\">"+k+" ("+DATA[k].items.length+")</button>";
  });
  document.getElementById("filters").innerHTML = fh;

  var sh = "";
  keys.forEach(function(name){
    if(filter!=="all"&&filter!==name)return;
    var sec = DATA[name];
    sh+='<div class="section"><div class="sec-head" onclick="toggle(this)">';
    sh+='<div class="sec-dot" style="background:'+sec.color+'"></div>';
    sh+='<div class="sec-title">'+name+'</div>';
    sh+='<div class="sec-count">'+sec.items.length+'</div>';
    sh+='<div class="sec-arrow open">&#9654;</div></div>';
    sh+='<div class="sec-body">';
    sec.items.forEach(function(item,i){
      var key = name+"::"+i;
      var safeKey = key.replace(/'/g,"\\'");
      var ck = checked[key]||item.s==="done";
      var userNote = notes[key]||"";
      var isEditing = editingNote === key;
      sh+='<div class="item">';
      sh+='<div class="item-row">';
      sh+='<div class="item-check'+(ck?" checked":"")+'" onclick="chk(\''+safeKey+'\')"></div>';
      sh+='<div class="item-text'+(ck?" checked-text":"")+'">'+item.t+'</div>';
      if(item.n)sh+='<div class="item-note">'+item.n+'</div>';
      var b=BADGE[item.s]||BADGE.todo;
      sh+='<span class="badge '+b.c+'">'+b.l+'</span>';
      sh+='<button class="note-btn'+(userNote?" has-note":"")+'" onclick="toggleNote(\''+safeKey+'\')" title="'+(userNote?"Edit note":"Add note")+'">&#9998;</button>';
      sh+='</div>';
      if(isEditing){
        sh+='<input class="user-note-edit" id="note-edit-'+i+'" value="'+esc(userNote)+'" placeholder="Add a note..." onkeydown="if(event.key===\'Enter\')saveNote(\''+safeKey+'\',this.value)" onblur="saveNote(\''+safeKey+'\',this.value)" />';
      } else if(userNote){
        sh+='<div class="user-note"><span class="user-note-text">'+esc(userNote)+'</span></div>';
      }
      sh+='</div>';
    });
    sh+='</div></div>';
  });
  document.getElementById("sections").innerHTML = sh;
  document.getElementById("updated").textContent = "Last updated: "+LAST_UPDATED;

  if(editingNote){
    var el = document.querySelector(".user-note-edit");
    if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}
  }
}

function met(label,val,color){
  return '<div class="metric"><div class="label">'+label+'</div><div class="val" style="color:'+color+'">'+val+'</div></div>';
}

function setF(f){filter=f;render()}

function toggle(el){
  var body=el.nextElementSibling;
  var arrow=el.querySelector(".sec-arrow");
  body.classList.toggle("collapsed");
  arrow.classList.toggle("open");
}

function chk(key){
  if(checked[key]){delete checked[key]}else{checked[key]=true}
  saveChecked();render();
}

function toggleNote(key){
  if(editingNote===key){editingNote=null}else{editingNote=key}
  render();
}

function saveNote(key,val){
  val = val.trim();
  if(val){notes[key]=val}else{delete notes[key]}
  editingNote=null;
  saveNotes();
  render();
}

renderInbox();
render();
loadFromSupabase();
</script>
</body>
</html>
